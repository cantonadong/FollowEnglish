[package]
name = "follow-english"
version = "2.0.0"
edition = "2021"
description = "FollowEnglish - English listening practice"

[[bin]]
name = "FollowEnglish-subtitles"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.windows-sys]
version = "0.59"
features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Registry"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
